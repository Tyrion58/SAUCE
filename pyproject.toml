[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sauce-uncertainty"
version = "0.1.0"
description = "Sequential uncertainty estimation for parallel multi-agent reasoning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "SAUCE authors"}]
dependencies = []

[project.optional-dependencies]
reproduce = ["math-verify==0.8.0"]

[project.urls]
Repository = "https://github.com/Tyrion58/SAUCE"
Issues = "https://github.com/Tyrion58/SAUCE/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-data = {sauce = ["py.typed"]}
